<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor Soal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f3;--card:#fff;--tx:#17262b;--mu:#5d7076;--bd:#cfdadd;--ac:#0d7a6b;--acx:#fff;--er:#b42318;--sel:#e2f1ee}
@media(prefers-color-scheme:dark){:root{--bg:#0f1719;--card:#172125;--tx:#e6eef0;--mu:#93a8ae;--bd:#2c3b40;--ac:#3fb8a5;--acx:#08201c;--er:#f97066;--sel:#1b3330}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
h2,h3{margin:.2em 0 .5em}h3{font-size:1rem}.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:8px}
input[type=radio],input[type=checkbox]{width:auto}
label{display:block;margin:8px 0;font-size:.92rem;color:var(--mu)}label input,label select,label textarea{margin-top:3px;color:var(--tx)}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:8px 14px;background:var(--ac);color:var(--acx);font-weight:700;display:inline-block}
button.ghost,.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.danger{background:transparent;color:var(--er);border:1px solid var(--er)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{display:flex;gap:12px;align-items:center;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--bd)}header b{flex:1;font-size:1.1rem}
main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px;max-width:1100px;margin:auto}
@media(max-width:800px){main{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center}.row input{flex:1}
.it{padding:8px 10px;border-radius:6px;cursor:pointer;margin-top:6px;border:1px solid transparent}.it small{display:block;color:var(--mu)}.it:hover{border-color:var(--bd)}.it.on{background:var(--sel);border-color:var(--ac)}
#daftar{max-height:70vh;overflow:auto;margin-top:8px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.op{display:grid;grid-template-columns:28px 1fr 110px auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--bd)}
@media(max-width:600px){.op{grid-template-columns:24px 1fr auto}.kn{grid-column:2}}
.kn label{margin:0;color:var(--tx)}.im{display:flex;gap:8px;align-items:center;margin-top:6px}.im img{height:44px;border-radius:4px}
.pi{max-width:100%;max-height:220px;border-radius:6px}.pt{max-height:90px;border-radius:4px;margin-top:4px}
.po{display:block;color:var(--tx);padding:6px 0}table{border-collapse:collapse}table.kt{width:100%}td,th{border:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}
.fld{margin:8px 0;font-size:.92rem;color:var(--mu)}.fld .rt{margin-top:3px}
.rt{min-height:44px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:8px;color:var(--tx)}.rt.sm{min-height:36px}.rt:empty::before{content:attr(data-ph);color:var(--mu)}
.mf{display:inline-block;padding:0 2px;border-radius:3px;cursor:pointer}.rt .mf:hover{background:var(--sel)}.ri>*{margin:.3em 0}.ri{overflow-x:auto}
.narrow{max-width:380px;margin:12vh auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}#toast.err{background:var(--er);color:#fff}
.tb{position:sticky;top:0;z-index:8;display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px 8px}
.sep{width:1px;height:22px;background:var(--bd);margin:0 6px}.dd{position:relative}
.tbn{position:relative;min-width:34px;height:34px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;gap:2px;background:transparent;color:var(--tx);border:1px solid transparent;border-radius:6px;font-weight:400}
.tbn:hover,.mi:hover,.gi:hover{background:var(--sel);border-color:var(--bd)}.tbn small{font-size:.65rem;color:var(--mu)}.ic{font-size:1.05rem;font-weight:700}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:3px 8px;border-radius:5px;font-size:.8rem;font-weight:400;white-space:nowrap;z-index:40;pointer-events:none}
.menu{position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px;min-width:190px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;background:transparent;color:var(--tx);border:1px solid transparent;border-radius:6px;font-weight:400;text-align:left}
.sg{display:grid;grid-template-columns:repeat(5,36px);gap:3px}.eg{display:grid;grid-template-columns:repeat(3,84px);gap:4px;margin-bottom:4px}
.gi{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:36px;padding:4px;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:6px;font-weight:400;font-size:1rem}.gi small{font-size:.7rem;color:var(--mu)}
.tg{display:grid;grid-template-columns:repeat(8,20px);gap:2px}.tg i{width:20px;height:20px;border:1px solid var(--bd);border-radius:3px;cursor:pointer}.tg i.on{background:var(--ac);border-color:var(--ac)}#tgl{margin:6px 0 4px;font-size:.85rem;color:var(--mu)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);padding:18px;width:min(380px,92vw)}dialog::backdrop{background:rgba(0,0,0,.45)}
.dpv{min-height:56px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--bd);border-radius:8px;margin:10px 0;font-size:1.3rem;overflow-x:auto}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>
<form id="lg" class="card narrow">
  <h2>Masuk sebagai super admin</h2>
  <label>Email<input id="em" type="email" required autocomplete="username"></label>
  <label>Password<input id="pw" type="password" required autocomplete="current-password"></label>
  <button type="submit">Masuk</button>
</form>

<div id="app" hidden>
  <header><b>Editor soal</b><span id="who" class="mu"></span><button id="keluar" class="ghost" type="button">Keluar</button></header>
  <main>
    <aside class="card">
      <div class="row"><input id="cari" placeholder="Cari soal" aria-label="Cari soal"><button id="baru" type="button">Soal baru</button></div>
      <div id="daftar"></div>
    </aside>
    <section>
    <div id="tb" class="card tb" aria-label="Alat format teks dan rumus"></div>
    <form id="f" class="card"></form><div id="pv" class="card"></div></section>
  </main>
</div>
<dialog id="dlg"><form method="dialog"><h3 id="dj"></h3><div id="dfl"></div><div id="dpv" class="dpv"></div>
  <div class="row"><button value="ok">Sisipkan</button><button type="button" id="dbatal" class="ghost">Batal</button></div></form></dialog>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
const SB_URL='https://owposvwxcmkvxhobtemv.supabase.co';
const SB_KEY='sb_publishable_4X4gb8JhUISDj4-nH_NFrQ_GLV87x6q';
const db=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pub=p=>db.storage.from('soal-gambar').getPublicUrl(p).data.publicUrl;
const src=o=>o.prev||(o.gambar?pub(o.gambar):'');
const T={pg:'Pilihan ganda',mcma:'MCMA',kategori:'Kategori'};
const baris=()=>({teks:'',gambar:'',prev:'',file:null,benar:false,kat:0});
const kosong=()=>({id:null,tipe:'pg',mapel:'',kelas:'',topik:'',teks:'',gambar:'',prev:'',file:null,labels:['Benar','Salah'],bobot:1,pembahasan:'',opsi:[baris(),baris(),baris(),baris()]});
const st={user:null,list:[],cur:kosong()};
DOMPurify.addHook('afterSanitizeAttributes',n=>{if(n.hasAttribute&&n.hasAttribute('style')){const m=/text-align:\s*(left|center|right|justify)/.exec(n.getAttribute('style'));m?n.setAttribute('style','text-align:'+m[1]):n.removeAttribute('style')}});
const bersih=h=>DOMPurify.sanitize(h||'',{ALLOWED_TAGS:['b','strong','i','em','u','sub','sup','br','p','div','span','ul','ol','li','table','tbody','thead','tr','td','th'],ALLOWED_ATTR:['style','class','data-tex','colspan','rowspan']});
const ringkas=h=>{const d=document.createElement('div');d.innerHTML=bersih(h);d.querySelectorAll('.mf').forEach(m=>m.textContent=m.dataset.tex);return d.textContent};
const hampa=h=>!/class="mf"|<table/.test(h||'')&&ringkas(h).trim()==='';
function rumusi(root){root.querySelectorAll('.mf').forEach(m=>{m.innerHTML='';katex.render(m.dataset.tex||'',m,{throwOnError:false})})}
function prep(e){e.querySelectorAll('.mf').forEach(m=>m.contentEditable='false');rumusi(e)}
function serial(e){const k=e.cloneNode(true);k.querySelectorAll('.mf').forEach(m=>{m.textContent='';m.removeAttribute('contenteditable')});const h=bersih(k.innerHTML).trim();return /^(<br>|\s)*$/.test(h)?'':h}

function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'err show':'show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',4000)}

/* ---------- login ---------- */
$('#lg').onsubmit=async e=>{e.preventDefault();
  const {error}=await db.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error)return toast('Login gagal: '+error.message,true);masuk()};
$('#keluar').onclick=async()=>{await db.auth.signOut();location.reload()};
async function masuk(){
  const {data:{session}}=await db.auth.getSession();if(!session)return;
  const {data:p,error}=await db.from('profil').select('peran,nama').eq('id',session.user.id).maybeSingle();
  if(error||!p||p.peran!=='super_admin'){await db.auth.signOut();return toast('Akun ini belum terdaftar sebagai super admin.',true)}
  st.user=session.user;$('#who').textContent=p.nama;$('#lg').hidden=true;$('#app').hidden=false;
  await muatDaftar();st.cur=kosong();form();
}

/* ---------- daftar soal ---------- */
async function muatDaftar(){
  const {data,error}=await db.from('soal').select('id,tipe,teks,mapel,kelas').order('dibuat_at',{ascending:false});
  if(error)return toast(error.message,true);st.list=data;daftar()}
function daftar(){const q=$('#cari').value.toLowerCase();
  $('#daftar').innerHTML=st.list.filter(s=>ringkas(s.teks).toLowerCase().includes(q)).map(s=>
    `<div class="it ${s.id===st.cur.id?'on':''}" data-id="${s.id}"><small>${T[s.tipe]}${s.kelas?', kelas '+s.kelas:''}${s.mapel?', '+esc(s.mapel):''}</small>${esc(ringkas(s.teks).slice(0,90))}</div>`).join('')
    ||'<p class="mu">Belum ada soal. Mulai dengan menulis soal pertama.</p>'}
$('#cari').oninput=daftar;
$('#daftar').onclick=e=>{const d=e.target.closest('.it');if(d)buka(d.dataset.id)};
$('#baru').onclick=()=>{st.cur=kosong();form();daftar()};
async function buka(id){
  const {data,error}=await db.from('soal').select('*,opsi(*,kunci(*))').eq('id',id).single();
  if(error)return toast(error.message,true);
  const ops=(data.opsi||[]).sort((a,b)=>a.urutan-b.urutan).map(o=>{const k=Array.isArray(o.kunci)?o.kunci[0]:o.kunci;
    return{teks:o.teks||'',gambar:o.gambar_path||'',prev:'',file:null,benar:!!k?.benar,kat:k?.kategori_benar??0}});
  st.cur={id:data.id,tipe:data.tipe,mapel:data.mapel||'',kelas:data.kelas??'',topik:data.topik||'',teks:data.teks,
    gambar:data.gambar_path||'',prev:'',file:null,labels:data.label_kategori||['Benar','Salah'],bobot:data.bobot,
    pembahasan:data.pembahasan||'',opsi:ops};
  form();daftar()}

/* ---------- formulir ---------- */
function imgBox(k,i,o){const s=src(o);
  return `<div class="im"><label class="btn ghost" style="margin:0">${s?'Ganti gambar':'Tambah gambar'}<input type="file" accept="image/*" hidden data-k="${k}" data-i="${i}"></label>${s?`<img src="${esc(s)}" alt=""><button type="button" class="ghost" data-act="rmimg" data-k="${k}" data-i="${i}">Hapus gambar</button>`:''}</div>`}
function form(){const c=st.cur,kat=c.tipe==='kategori';
  $('#f').innerHTML=`<h2>${c.id?'Edit soal':'Soal baru'}</h2>
<div class="g3"><label>Jenis soal<select name="tipe">${Object.entries(T).map(([k,v])=>`<option value="${k}" ${c.tipe===k?'selected':''}>${v}</option>`).join('')}</select></label>
<label>Mata pelajaran<input name="mapel" value="${esc(c.mapel)}"></label>
<label>Kelas<input name="kelas" type="number" min="1" max="6" value="${esc(c.kelas)}"></label>
<label>Topik<input name="topik" value="${esc(c.topik)}"></label>
<label>Bobot<input name="bobot" type="number" min="0.5" step="0.5" value="${esc(c.bobot)}"></label></div>
<div class="fld">Pertanyaan<div class="rt" contenteditable="true" role="textbox" aria-label="Pertanyaan" data-f="teks" data-ph="Tulis pertanyaan di sini">${bersih(c.teks)}</div></div>${imgBox('soal',0,c)}
${kat?`<label>Pilihan kategori, pisahkan dengan koma<input name="labels" value="${esc(c.labels.join(', '))}"></label>`:''}
<h3>${kat?'Pernyataan':'Pilihan jawaban'}</h3>
${c.opsi.map((o,i)=>`<div class="op"><b>${kat?i+1:String.fromCharCode(65+i)}</b>
<div><div class="rt sm" contenteditable="true" role="textbox" data-f="ot${i}" data-ph="${kat?'Tulis pernyataan':'Tulis pilihan'}" aria-label="Teks ${i+1}">${bersih(o.teks)}</div>${imgBox('opsi',i,o)}</div>
<div class="kn">${c.tipe==='pg'?`<label><input type="radio" name="benar" value="${i}" ${o.benar?'checked':''}> Jawaban benar</label>`
 :c.tipe==='mcma'?`<label><input type="checkbox" name="ck${i}" ${o.benar?'checked':''}> Jawaban benar</label>`
 :`<select name="kat${i}" aria-label="Kategori yang benar">${c.labels.map((l,j)=>`<option value="${j}" ${o.kat===j?'selected':''}>${esc(l)}</option>`).join('')}</select>`}</div>
<button type="button" class="ghost" data-act="rm" data-i="${i}" aria-label="Hapus baris">Hapus</button></div>`).join('')}
<button type="button" class="ghost" data-act="add">Tambah ${kat?'pernyataan':'pilihan'}</button>
<div class="fld">Pembahasan, opsional<div class="rt" contenteditable="true" role="textbox" aria-label="Pembahasan" data-f="pembahasan" data-ph="Tulis pembahasan jika ada">${bersih(c.pembahasan)}</div></div>
<div class="row"><button type="submit" id="sv">Simpan soal</button>${c.id?'<button type="button" class="danger" data-act="del">Hapus soal</button>':''}</div>`;
  $('#f').querySelectorAll('.rt').forEach(prep);pratinjau()}

function collect(){const f=$('#f'),c=st.cur,v=n=>f.elements[n]?.value??'';
  c.tipe=v('tipe');c.mapel=v('mapel');c.kelas=v('kelas');c.topik=v('topik');c.bobot=v('bobot');const rt=n=>serial(f.querySelector('[data-f="'+n+'"]'));c.teks=rt('teks');c.pembahasan=rt('pembahasan');
  if(c.tipe==='kategori'&&f.elements.labels)c.labels=v('labels').split(',').map(s=>s.trim()).filter(Boolean);
  const sel=f.elements.benar?.value;
  c.opsi.forEach((o,i)=>{o.teks=rt('ot'+i);
    if(c.tipe==='pg')o.benar=String(i)===sel;else if(c.tipe==='mcma')o.benar=!!f.elements['ck'+i]?.checked;else o.kat=+v('kat'+i)||0})}

function pratinjau(){const c=st.cur,gb=o=>src(o)?`<br><img class="pt" src="${esc(src(o))}" alt="">`:'';
  $('#pv').innerHTML=`<h3>Pratinjau tampilan siswa</h3><div class="ri">${hampa(c.teks)?'<span class="mu">Pertanyaan akan tampil di sini.</span>':bersih(c.teks)}</div>`
  +(src(c)?`<img class="pi" src="${esc(src(c))}" alt="">`:'')
  +(c.tipe==='kategori'
    ?`<table class="kt"><tr><th></th>${c.labels.map(l=>`<th>${esc(l)}</th>`).join('')}</tr>${c.opsi.map(o=>`<tr><td><div class="ri">${bersih(o.teks)}</div>${gb(o)}</td>${c.labels.map(()=>'<td><input type="radio" disabled></td>').join('')}</tr>`).join('')}</table>`
    :c.opsi.map(o=>`<label class="po" style="display:flex;gap:8px"><input type="${c.tipe==='pg'?'radio':'checkbox'}" disabled><span class="ri">${bersih(o.teks)}${gb(o)}</span></label>`).join(''));
  rumusi($('#pv'))}

/* ---------- gambar ---------- */
async function kompres(file,maxW=900){
  const b=await createImageBitmap(file),r=Math.min(1,maxW/b.width),cv=document.createElement('canvas');
  cv.width=Math.round(b.width*r);cv.height=Math.round(b.height*r);cv.getContext('2d').drawImage(b,0,0,cv.width,cv.height);
  return new Promise(res=>cv.toBlob(res,'image/webp',.8))}
async function unggah(blob){const p=crypto.randomUUID()+'.webp';
  const {error}=await db.storage.from('soal-gambar').upload(p,blob,{contentType:'image/webp'});if(error)throw error;return p}

/* ---------- event formulir ---------- */
const F=$('#f');
F.addEventListener('input',()=>{collect();pratinjau()});
F.addEventListener('change',async e=>{const t=e.target;
  if(t.type==='file'){const file=t.files[0];if(!file)return;collect();
    const o=t.dataset.k==='soal'?st.cur:st.cur.opsi[+t.dataset.i];
    try{o.file=await kompres(file);o.prev=URL.createObjectURL(o.file)}catch{return toast('Gambar tidak bisa dibaca. Coba file lain.',true)}
    return form()}
  if(t.name==='tipe'||t.name==='labels'){collect();if(st.cur.labels.length<2)st.cur.labels=['Benar','Salah'];form()}});
F.addEventListener('click',e=>{const a=e.target.dataset.act;if(!a)return;collect();
  const c=st.cur,i=+e.target.dataset.i;
  if(a==='add')c.opsi.push(baris());
  if(a==='rm'){if(c.opsi.length<=2)return toast('Minimal ada 2 baris.',true);c.opsi.splice(i,1)}
  if(a==='rmimg'){const o=e.target.dataset.k==='soal'?c:c.opsi[i];o.gambar='';o.prev='';o.file=null}
  if(a==='del')return hapus();
  form()});
F.onsubmit=e=>{e.preventDefault();simpan()};

/* ---------- simpan & hapus ---------- */
function validasi(c){
  if(hampa(c.teks))return'Pertanyaan belum diisi.';
  if(c.opsi.some(o=>hampa(o.teks)&&!src(o)))return'Ada pilihan atau pernyataan yang masih kosong.';
  const n=c.opsi.filter(o=>o.benar).length;
  if(c.tipe==='pg'&&n!==1)return'Pilihan ganda harus punya tepat 1 jawaban benar.';
  if(c.tipe==='mcma'&&n<2)return'MCMA harus punya minimal 2 jawaban benar.';
  if(c.tipe==='kategori'&&c.labels.length<2)return'Isi minimal 2 pilihan kategori.';
  if(c.tipe==='kategori'&&c.opsi.some(o=>o.kat>=c.labels.length))return'Ada kategori jawaban yang tidak valid.'}
async function simpan(){
  collect();const c=st.cur,err=validasi(c);if(err)return toast(err,true);
  const b=$('#sv');b.disabled=true;b.textContent='Menyimpan...';
  try{
    if(c.file){c.gambar=await unggah(c.file);c.file=null}
    for(const o of c.opsi)if(o.file){o.gambar=await unggah(o.file);o.file=null}
    const row={tipe:c.tipe,mapel:c.mapel||null,kelas:c.kelas?+c.kelas:null,topik:c.topik||null,teks:c.teks,gambar_path:c.gambar||null,
      label_kategori:c.tipe==='kategori'?c.labels:null,bobot:+c.bobot||1,pembahasan:c.pembahasan||null};
    let id=c.id;
    if(id){const r1=await db.from('soal').update(row).eq('id',id);if(r1.error)throw r1.error;
      const r2=await db.from('opsi').delete().eq('soal_id',id);if(r2.error)throw r2.error}
    else{row.dibuat_oleh=st.user.id;const r=await db.from('soal').insert(row).select('id').single();if(r.error)throw r.error;id=r.data.id}
    const r3=await db.from('opsi').insert(c.opsi.map((o,i)=>({soal_id:id,urutan:i,teks:o.teks||null,gambar_path:o.gambar||null}))).select('id,urutan');
    if(r3.error)throw r3.error;
    const ops=r3.data.sort((a,b)=>a.urutan-b.urutan);
    const r4=await db.from('kunci').insert(ops.map((r,i)=>c.tipe==='kategori'?{opsi_id:r.id,kategori_benar:c.opsi[i].kat}:{opsi_id:r.id,benar:!!c.opsi[i].benar}));
    if(r4.error)throw r4.error;
    toast('Soal tersimpan.');await muatDaftar();await buka(id);
  }catch(e){toast('Gagal menyimpan: '+(e.message||e),true);b.disabled=false;b.textContent='Simpan soal'}}
async function hapus(){
  if(!confirm('Hapus soal ini? Soal yang sudah masuk paket ujian tidak bisa dihapus.'))return;
  const {error}=await db.from('soal').delete().eq('id',st.cur.id);
  if(error)return toast('Gagal menghapus: '+error.message,true);
  toast('Soal dihapus.');st.cur=kosong();await muatDaftar();form()}

/* ---------- toolbar format & rumus ---------- */
document.addEventListener('focusin',e=>{if(e.target.classList?.contains('rt'))st.fokus=e.target});
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&st.fokus?.contains(s.anchorNode))st.rng=s.getRangeAt(0).cloneRange()});
const ubah=()=>st.fokus.dispatchEvent(new Event('input',{bubbles:true}));
function pulih(){st.fokus.focus();if(st.rng){const s=getSelection();s.removeAllRanges();s.addRange(st.rng)}}
function sisip(h){if(!st.fokus?.isConnected)return toast('Klik dulu di kolom yang ingin diisi.',true);
  pulih();document.execCommand('insertHTML',false,h);prep(st.fokus);ubah()}
const rumus=t=>t&&sisip(`<span class="mf" data-tex="${esc(t)}"></span>&nbsp;`);
const sv=b=>`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">${b}</svg>`;
const iRata=m=>sv([14,9,14,9].map((l,i)=>{const x=m==='right'?15-l:m==='center'?(16-l)/2:1,y=3+i*3.4;return `<line x1="${x}" x2="${x+(m==='full'?14:l)}" y1="${y}" y2="${y}"/>`}).join(''));
const iDaftar=sv([3,8,13].map(y=>`<circle cx="2.5" cy="${y}" r="1" fill="currentColor"/><line x1="6" x2="15" y1="${y}" y2="${y}"/>`).join(''));
const iTabel=sv('<rect x="1.5" y="2.5" width="13" height="11"/><line x1="1.5" x2="14.5" y1="8" y2="8"/><line x1="8" x2="8" y1="2.5" y2="13.5"/>');
function sel(){const n=st.rng?.startContainer,el=n&&(n.nodeType===1?n:n.parentElement),td=el&&st.fokus?.contains(el)?el.closest('td,th'):null;
  if(!td)toast('Klik dulu di dalam sel tabel.',true);return td}
const AKSI={
 baris(){const td=sel();if(!td)return;const tr=td.parentElement,n=tr.cloneNode(true);n.querySelectorAll('td,th').forEach(x=>x.innerHTML='<br>');tr.after(n);ubah()},
 kolom(){const td=sel();if(!td)return;const i=td.cellIndex;td.closest('table').querySelectorAll('tr').forEach(r=>{const c=document.createElement('td');c.innerHTML='<br>';r.cells[i]?.after(c)});ubah()},
 hapustabel(){const td=sel();if(!td)return;td.closest('table').remove();ubah()}};
const tabelHtml=(r,k)=>'<table>'+('<tr>'+'<td><br></td>'.repeat(k)+'</tr>').repeat(r)+'</table><p><br></p>';
const PERS={
 pecahan:['Pecahan',[['a','Pembilang (angka atas)','1'],['b','Penyebut (angka bawah)','2']],v=>`\\frac{${v.a}}{${v.b}}`],
 campuran:['Bilangan campuran',[['w','Bilangan bulat','2'],['a','Pembilang','1'],['b','Penyebut','4']],v=>`${v.w}\\frac{${v.a}}{${v.b}}`],
 pangkat:['Pangkat',[['a','Bilangan dasar','x'],['b','Pangkat','2']],v=>`${v.a}^{${v.b}}`],
 indeks:['Indeks bawah',[['a','Bilangan dasar','x'],['b','Indeks','1']],v=>`${v.a}_{${v.b}}`],
 akar:['Akar kuadrat',[['a','Angka di dalam akar','25']],v=>`\\sqrt{${v.a}}`],
 akarn:['Akar pangkat n',[['n','Pangkat akar','3'],['a','Angka di dalam akar','27']],v=>`\\sqrt[${v.n}]{${v.a}}`],
 bebas:['Rumus lain (LaTeX)',[['t','Rumus','x^{2}+3x=10']],v=>v.t]};
const CTH={pecahan:'\\frac{a}{b}',campuran:'n\\frac{a}{b}',pangkat:'x^{n}',indeks:'x_{n}',akar:'\\sqrt{x}',akarn:'\\sqrt[n]{x}'};
const SIMB=[['×','Kali'],['÷','Bagi'],['±','Plus minus'],['≤','Kurang dari atau sama dengan'],['≥','Lebih dari atau sama dengan'],['≠','Tidak sama dengan'],['≈','Hampir sama dengan'],['π','Pi'],['°','Derajat'],['√','Akar'],['∞','Tak hingga'],['²','Kuadrat'],['³','Pangkat tiga'],['½','Setengah'],['¼','Seperempat'],['¾','Tiga perempat'],['△','Segitiga'],['∠','Sudut'],['⊥','Tegak lurus'],['∥','Sejajar']];

function formulir(judul,fields,tpl,opsi){return new Promise(res=>{
  const d=$('#dlg'),L=$('#dfl');$('#dj').textContent=judul;
  L.innerHTML=fields.map(([k,l,df])=>`<label>${l}<input data-k="${k}" value="${esc(df)}" autocomplete="off"></label>`).join('');
  const val=()=>Object.fromEntries([...L.querySelectorAll('input')].map(i=>[i.dataset.k,i.value.trim()]));
  const pv=()=>katex.render(tpl(val())||' ',$('#dpv'),{throwOnError:false});
  L.oninput=pv;pv();
  d.onclose=()=>{const v=val();res(d.returnValue==='ok'&&(opsi?.kosong||Object.values(v).every(Boolean))?tpl(v):null)};
  $('#dbatal').onclick=()=>d.close('batal');
  d.returnValue='';d.showModal();L.querySelector('input').select()})}
async function persamaan(k){const [j,f,t]=PERS[k],tex=await formulir(j,f,t);if(tex)rumus(tex)}

function bangun(){
  const T=(tip,x,h)=>`<button type="button" class="tbn" data-tip="${tip}" aria-label="${tip}" data-x="${x}">${h}</button>`;
  const D=(tip,h,m)=>`<div class="dd"><button type="button" class="tbn" data-tip="${tip}" aria-label="${tip}" aria-haspopup="true" data-dd>${h}<small>▾</small></button><div class="menu" hidden>${m}</div></div>`;
  const MI=(a,h,t)=>`<button type="button" class="mi" ${a}>${h}<span>${t}</span></button>`;
  const sep='<i class="sep"></i>';
  const rata=[['left','justifyLeft','Rata kiri'],['center','justifyCenter','Rata tengah'],['right','justifyRight','Rata kanan'],['full','justifyFull','Rata kiri-kanan']].map(([m,x,t])=>MI(`data-x="${x}"`,iRata(m),t)).join('');
  const daftar=MI('data-x="insertUnorderedList"',iDaftar,'Daftar poin')+MI('data-x="insertOrderedList"','<b>1.</b>','Daftar bernomor');
  const tabel='<div class="tg">'+Array.from({length:48},(_,i)=>`<i data-r="${Math.floor(i/8)+1}" data-c="${i%8+1}"></i>`).join('')+'</div><div id="tgl">Pilih ukuran tabel</div>'
    +MI('data-a="baris"','+','Tambah baris di bawah')+MI('data-a="kolom"','+','Tambah kolom di kanan')+MI('data-a="hapustabel"','×','Hapus tabel');
  const galeri='<div class="eg">'+Object.keys(CTH).map(k=>`<button type="button" class="gi" data-q="${k}" aria-label="${PERS[k][0]}">${katex.renderToString(CTH[k],{throwOnError:false})}<small>${PERS[k][0]}</small></button>`).join('')+'</div>'
    +MI('data-q="bebas"','<span class="ic">∑</span>','Rumus lain (LaTeX)...');
  const simb='<div class="sg">'+SIMB.map(([c,n])=>`<button type="button" class="gi" data-s="${c}" data-tip="${n}" aria-label="${n}">${c}</button>`).join('')+'</div>';
  $('#tb').innerHTML=T('Urungkan','undo','↶')+T('Ulangi','redo','↷')+sep
    +T('Tebal (Ctrl+B)','bold','<b>B</b>')+T('Miring (Ctrl+I)','italic','<i>I</i>')+T('Garis bawah (Ctrl+U)','underline','<u>U</u>')
    +T('Pangkat, misalnya m3 menjadi m³','superscript','x<sup>2</sup>')+T('Indeks bawah','subscript','x<sub>2</sub>')+sep
    +D('Rata teks',iRata('left'),rata)+D('Daftar',iDaftar,daftar)+D('Sisipkan tabel',iTabel,tabel)+sep
    +D('Persamaan: pecahan, akar, pangkat','<span class="ic">π</span>',galeri)+D('Simbol','<span class="ic">Ω</span>',simb)+sep
    +T('Hapus format teks','removeFormat','<span class="ic">Aa</span>')}
bangun();
const tb=$('#tb'),tutup=()=>tb.querySelectorAll('.menu').forEach(m=>m.hidden=true);
tb.addEventListener('mousedown',e=>e.preventDefault());
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))tutup()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')tutup()});
tb.addEventListener('mouseover',e=>{const c=e.target.closest('.tg i');if(!c)return;const r=+c.dataset.r,k=+c.dataset.c;
  tb.querySelectorAll('.tg i').forEach(x=>x.classList.toggle('on',+x.dataset.r<=r&&+x.dataset.c<=k));$('#tgl').textContent=r+' × '+k+' kotak'});
tb.addEventListener('click',e=>{const g=e.target.closest('.tg i'),b=e.target.closest('button');
  if(b?.hasAttribute('data-dd')){const m=b.nextElementSibling,buka=m.hidden;tutup();m.hidden=!buka;return}
  if(!g&&!b)return;tutup();
  if(!st.fokus?.isConnected)return toast('Klik dulu di kolom yang ingin diisi.',true);
  if(g)return sisip(tabelHtml(+g.dataset.r,+g.dataset.c));
  const d=b.dataset;
  if(d.x){pulih();document.execCommand(d.x);ubah()}
  else if(d.s)sisip(esc(d.s));
  else if(d.q)persamaan(d.q);
  else if(d.a)AKSI[d.a]()});
$('#f').addEventListener('click',async e=>{const m=e.target.closest('.mf');if(!m)return;
  const ed=m.closest('.rt');st.fokus=ed;
  const t=await formulir('Ubah rumus (kosongkan untuk menghapus)',[['t','Rumus (LaTeX)',m.dataset.tex]],v=>v.t,{kosong:true});
  if(t===null)return;if(t==='')m.remove();else{m.dataset.tex=t;rumusi(ed)}ubah()});
$('#f').addEventListener('paste',e=>{if(!e.target.closest('.rt'))return;e.preventDefault();
  const h=e.clipboardData.getData('text/html'),t=e.clipboardData.getData('text/plain');
  document.execCommand('insertHTML',false,h?bersih(h):esc(t).replace(/\n/g,'<br>'))});

masuk();
</script>
</body>
</html>
